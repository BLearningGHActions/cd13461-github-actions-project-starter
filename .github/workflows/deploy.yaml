name: "CorpX Pipeline"
run-name: Executing Pipeline
on: 
  push:
    branches: ["main"]
    paths-ignore: 
    - ".gitignore"
    - "README.md"
    - "CONTRIBUTING.md"
    - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore: 
    - ".gitignore"
    - "README.md"
    - "CONTRIBUTING.md"
    - "LICENSE"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment for this manual run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT || 30 }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
            
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: | 
          npm install
          npm rebuild sharp

      - name: Install Pagefind binary
        run: npx pagefind@latest --version
        
      - name: Run all linters
        run: npm run lint:all

      - name: Run repository scripts
        shell: bash
        run: |
          for file in script/*; do
            if [ -f "$file" ] && [ "${file##*.}" = "js" ]; then
              node "$file" --timeout "$URL_CHECKER_TIMEOUT" --directory ./src/posts
            fi
          done
              
  build:
    name: Build
    needs: test
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-
            
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: | 
          npm install
          npm rebuild sharp

      - name: Install Pagefind binary
        run: npx pagefind@latest --version

      - name: Build static site
        shell: bash
        env:
          PATH_PREFIX: '/${{ github.event.repository.name }}/'
        run: |
          PATH_PREFIX="$PATH_PREFIX" npm run eleventy:prod
      
      - name: Upload Github pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          
  deploy:
    name: Deploy
    needs: [test, build]
    if: >
      ${{
        needs.test.result == 'success' &&
        needs.build.result == 'success' &&
        github.event_name != 'pull_request' &&
        (github.event_name != 'workflow_dispatch' || inputs.force_deploy == true)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      issues: write

    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
   
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Report deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_URL: ${{ steps.deploy.outputs.page_url }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(date -u +%F)"

          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            STATUS="succeeded"
          else
            STATUS="failed"
          fi

          URL="${DEPLOY_URL:-https://${REPOSITORY%%/*}.github.io/${REPOSITORY#*/}/}"

          gh issue create \
            --repo "$REPOSITORY" \
            --title "$DATE - Deployment: $STATUS" \
            --body "URL: $URL"
            
      - name: Fail if deployment failed
        if: ${{ steps.deploy.outcome != 'success' }}
        run: exit 1
